<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef5fb"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#3153d9"/>
      <stop offset="1" stop-color="#5e7cff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#13233c" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="1600" height="920" rx="36" fill="url(#bg)"/>
  <text x="90" y="92" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#122033">GENERALIZED MACHINE-LEARNING WORKFLOW</text>
  <text x="90" y="135" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#5c6d83">Methodological overview for structure-aware prediction in organosilane-mediated carbonyl reduction</text>

  <!-- arrows -->
  <g stroke="#7b8da6" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M330 435 H410"/><path d="M680 435 H760"/><path d="M1030 435 H1110"/><path d="M1380 435 H1460"/>
  </g>
  <g fill="#7b8da6">
    <polygon points="410,435 388,421 388,449"/>
    <polygon points="760,435 738,421 738,449"/>
    <polygon points="1110,435 1088,421 1088,449"/>
    <polygon points="1460,435 1438,421 1438,449"/>
  </g>

  <!-- cards -->
  <g filter="url(#shadow)">
    <rect x="80" y="245" width="250" height="380" rx="28" fill="#ffffff" stroke="#d9e4ef" stroke-width="2"/>
    <rect x="430" y="245" width="250" height="380" rx="28" fill="#ffffff" stroke="#d9e4ef" stroke-width="2"/>
    <rect x="780" y="245" width="250" height="380" rx="28" fill="#ffffff" stroke="#d9e4ef" stroke-width="2"/>
    <rect x="1130" y="245" width="250" height="380" rx="28" fill="#ffffff" stroke="#d9e4ef" stroke-width="2"/>
    <rect x="1460" y="245" width="60" height="380" rx="28" fill="#ffffff" stroke="#d9e4ef" stroke-width="2" opacity="0"/>
  </g>

  <!-- Card 1 -->
  <circle cx="205" cy="335" r="54" fill="#e8edff"/>
  <g stroke="#3153d9" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M164 339 h82"/><path d="M182 316 l23 23 -23 23"/>
    <circle cx="231" cy="316" r="10" fill="#74e5ff" stroke="none"/>
  </g>
  <text x="205" y="445" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#122033">Reaction space</text>
  <text x="205" y="485" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#5c6d83">substrates · silanes</text>
  <text x="205" y="515" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#5c6d83">ligands · conditions</text>

  <!-- Card 2 -->
  <circle cx="555" cy="335" r="54" fill="#e8f8f4"/>
  <g fill="#1f7a64">
    <circle cx="532" cy="318" r="10"/><circle cx="580" cy="322" r="10"/><circle cx="552" cy="355" r="10"/>
  </g>
  <g stroke="#1f7a64" stroke-width="4"><line x1="540" y1="324" x2="572" y2="324"/><line x1="538" y1="327" x2="548" y2="348"/><line x1="575" y1="330" x2="559" y2="348"/></g>
  <text x="555" y="445" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#122033">DFT descriptors</text>
  <text x="555" y="485" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#5c6d83">electronic · steric</text>
  <text x="555" y="515" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#5c6d83">geometric · molecular</text>

  <!-- Card 3 -->
  <circle cx="905" cy="335" r="54" fill="#f1ebff"/>
  <g fill="#6d4bd1">
    <rect x="872" y="307" width="16" height="16" rx="3"/><rect x="894" y="307" width="16" height="16" rx="3"/><rect x="916" y="307" width="16" height="16" rx="3"/>
    <rect x="872" y="329" width="16" height="16" rx="3"/><rect x="894" y="329" width="16" height="16" rx="3"/><rect x="916" y="329" width="16" height="16" rx="3"/>
    <rect x="872" y="351" width="16" height="16" rx="3"/><rect x="894" y="351" width="16" height="16" rx="3"/><rect x="916" y="351" width="16" height="16" rx="3"/>
  </g>
  <text x="905" y="445" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#122033">Molecular embeddings</text>
  <text x="905" y="485" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#5c6d83">SMILES-based learned</text>
  <text x="905" y="515" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#5c6d83">representations</text>

  <!-- Card 4 -->
  <circle cx="1255" cy="335" r="54" fill="#e8edff"/>
  <g fill="none" stroke="#3153d9" stroke-width="4">
    <circle cx="1228" cy="315" r="8"/><circle cx="1228" cy="352" r="8"/><circle cx="1257" cy="333" r="8"/><circle cx="1284" cy="315" r="8"/><circle cx="1284" cy="352" r="8"/>
    <line x1="1236" y1="315" x2="1249" y2="330"/><line x1="1236" y1="352" x2="1249" y2="336"/><line x1="1265" y1="330" x2="1276" y2="315"/><line x1="1265" y1="337" x2="1276" y2="352"/>
  </g>
  <text x="1255" y="445" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#122033">Predictive modelling</text>
  <text x="1255" y="485" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#5c6d83">regression · ensembles</text>
  <text x="1255" y="515" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#5c6d83">cross-validation</text>

  <!-- Output / interpretability area -->
  <rect x="1430" y="285" width="130" height="300" rx="28" fill="url(#accent)" filter="url(#shadow)"/>
  <circle cx="1495" cy="350" r="38" fill="#ffffff" opacity="0.18"/>
  <g stroke="#ffffff" stroke-width="5" fill="none" stroke-linecap="round"><path d="M1474 355 l15 15 29-38"/></g>
  <text x="1495" y="438" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#ffffff">Prediction</text>
  <text x="1495" y="472" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#ffffff">+</text>
  <text x="1495" y="506" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Interpretation</text>

  <rect x="90" y="705" width="1420" height="118" rx="24" fill="#0f1b2c"/>
  <text x="120" y="754" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#74e5ff">METHOD FOCUS</text>
  <text x="120" y="792" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#d4e0ec">Combine chemically meaningful physics-based features with learned molecular representations, then interpret the model in chemical terms.</text>
</svg>
